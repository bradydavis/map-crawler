<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Map Tile Downloader</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://js.arcgis.com/4.19/esri/themes/light/main.css">
    <style>
        .thumbnail img {
            max-width: 150px;
            max-height: 150px;
        }
        #map {
            width: 100%;
            height: 600px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Upload CSV</h1>
        <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data" class="mb-4">
            <div class="form-group">
                <label for="systemPrompt">I'm looking for:</label>
                <input type="text" name="systemPrompt" id="systemPrompt" class="form-control" placeholder="Describe what you're looking for..." required>
            </div>
            <div class="form-group">
                <input type="file" name="file" accept=".csv" class="form-control-file" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
        <div class="form-group">
            <label for="filter">Filter Markers:</label>
            <select id="filter" class="form-control">
                <option value="all">Show All</option>
                <option value="yes">Show Matches</option>
                <option value="no">Show Non-Matches</option>
            </select>
        </div>
        <div id="map"></div>
        <a id="downloadLink" href="#" class="btn btn-success mt-4" style="display:none;">Download Summary CSV</a>
    </div>

    <!-- Status Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1" role="dialog" aria-labelledby="statusModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="statusModalLabel">Processing...</h5>
                </div>
                <div class="modal-body">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <p>Crunching data.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://js.arcgis.com/4.19/"></script>

    <script>
        $(document).ready(function() {
            let summariesData = []; // Store the summaries data

            require([
                "esri/Map",
                "esri/views/MapView",
                "esri/Graphic",
                "esri/layers/GraphicsLayer"
            ], function(Map, MapView, Graphic, GraphicsLayer) {
                const map = new Map({
                    basemap: "streets-navigation-vector"
                });

                const view = new MapView({
                    container: "map",
                    map: map,
                    center: [-98.5795, 39.8283], // Center the map on the USA
                    zoom: 3
                });

                const graphicsLayer = new GraphicsLayer();
                map.add(graphicsLayer);

                $('#uploadForm').on('submit', function(event) {
                    event.preventDefault();
                    const formData = new FormData(event.target);
                    const systemPrompt = $('#systemPrompt').val();

                    // Show the status modal
                    $('#statusModal').modal('show');

                    fetch('/upload', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        // Hide the status modal
                        $('#statusModal').modal('hide');

                        if (data.summaries) {
                            summariesData = data.summaries;
                            console.log(summariesData); // Debugging line to check data
                            addMarkersToMap(summariesData, systemPrompt);
                            $('#downloadLink').show().attr('href', '/download_summary');
                        } else if (data.error) {
                            alert(data.error);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        $('#statusModal').modal('hide');
                        alert('An error occurred while processing the file.');
                    });
                });

                $('#filter').on('change', function() {
                    const filterValue = $(this).val();
                    const filteredSummaries = summariesData.filter(item => {
                        if (filterValue === 'all') return true;
                        const summaryText = item.summary.toLowerCase().trim().replace(/[.,]/g, '');
                        return summaryText === filterValue;
                    });
                    graphicsLayer.removeAll();
                    addMarkersToMap(filteredSummaries, $('#systemPrompt').val());
                });

                function addMarkersToMap(summaries, systemPrompt) {
                    const graphics = summaries.map(item => {
                        const point = {
                            type: "point",
                            longitude: parseFloat(item.lon),
                            latitude: parseFloat(item.lat)
                        };

                        // Normalize the summary text
                        const summaryText = item.summary.toLowerCase().trim().replace(/[.,]/g, '');

                        // Change this condition based on your actual logic
                        const markerColor = summaryText === 'yes' ? [255, 0, 0] : [0, 255, 0];

                        const markerSymbol = {
                            type: "simple-marker",
                            color: markerColor,
                            outline: {
                                color: [255, 255, 255],
                                width: 2
                            }
                        };

                        const popupTemplate = {
                            title: "Summary",
                            content: `<h3>${systemPrompt}</h3><p>${item.summary}</p><img src="${item.image_url}" class="img-fluid" alt="Image">`
                        };

                        return new Graphic({
                            geometry: point,
                            symbol: markerSymbol,
                            attributes: item,
                            popupTemplate: popupTemplate
                        });
                    });

                    graphicsLayer.addMany(graphics);

                    // Fit the view to the bounds of the markers
                    if (graphics.length > 0) {
                        view.goTo(graphicsLayer.graphics);
                    }
                }
            });
        });
    </script>
</body>
</html>
