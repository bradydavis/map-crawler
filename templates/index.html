<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Analyzer</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://js.arcgis.com/4.19/esri/themes/light/main.css">
    <style>
        .thumbnail img {
            max-width: 150px;
            max-height: 150px;
        }
        #map {
            width: 100%;
            height: 600px;
        }
        #menu {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 999;
        }
        #drawButton {
            position: absolute;
            top: 60px;
            right: 10px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="menu" class="dropdown">
        <button class="btn btn-secondary dropdown-toggle" type="button" id="menuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            Menu
        </button>
        <div class="dropdown-menu" aria-labelledby="menuButton">
            <button class="dropdown-item" id="uploadFileButton">Upload File</button>
            <button class="dropdown-item" id="downloadSummaryButton" style="display:none;">Download Summary</button>
            <button class="dropdown-item" id="filterButton">Filter Options</button>
        </div>
    </div>
    <div id="drawButton">
        <button class="btn btn-primary" id="drawBoundingBoxButton">Draw Bounding Box</button>
    </div>
    <div class="container mt-5">
        <h1 class="mb-4">Map Analyzer</h1>
        <div class="form-group">
            <label for="systemPrompt">I'm looking for:</label>
            <input type="text" name="systemPrompt" id="systemPrompt" class="form-control" placeholder="Describe what you're looking for..." required>
        </div>
        <p>Instructions: Select an area on the map to search (no larger than 1 mile).</p>
        <div id="map"></div>
        <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data" style="display:none;">
            <div class="form-group">
                <input type="file" name="file" accept=".csv" class="form-control-file" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
        <div class="form-group" id="filterOptions" style="display:none;">
            <label for="filter">Filter Markers:</label>
            <select id="filter" class="form-control">
                <option value="all">Show All</option>
                <option value="yes">Show Matches</option>
                <option value="no">Show Non-Matches</option>
            </select>
        </div>
        <button id="exportButton" class="btn btn-secondary mt-4">Export Map as Image</button>
    </div>

    <!-- Status Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1" role="dialog" aria-labelledby="statusModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="statusModalLabel">Processing...</h5>
                </div>
                <div class="modal-body">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <p>Crunching data.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://js.arcgis.com/4.19/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.4.1/html2canvas.min.js"></script>

    <script>
        $(document).ready(function() {
            let summariesData = []; // Store the summaries data

            require([
                "esri/Map",
                "esri/views/MapView",
                "esri/Graphic",
                "esri/layers/GraphicsLayer",
                "esri/widgets/Sketch/SketchViewModel",
                "esri/geometry/geometryEngine"
            ], function(Map, MapView, Graphic, GraphicsLayer, SketchViewModel, geometryEngine) {
                const map = new Map({
                    basemap: "streets-navigation-vector"
                });

                const view = new MapView({
                    container: "map",
                    map: map,
                    center: [-98.5795, 39.8283], // Center the map on the USA
                    zoom: 3
                });

                const graphicsLayer = new GraphicsLayer();
                map.add(graphicsLayer);

                const sketchViewModel = new SketchViewModel({
                    view: view,
                    layer: graphicsLayer,
                    polygonSymbol: {
                        type: "simple-fill",
                        color: [138, 43, 226, 0.4],
                        outline: {
                            color: [138, 43, 226],
                            width: 2
                        }
                    }
                });

                sketchViewModel.on("create", function(event) {
                    if (event.state === "complete") {
                        const polygon = event.graphic.geometry;
                        const area = geometryEngine.geodesicArea(polygon, "square-miles");
                        if (area > 1) {
                            alert("The selected area is larger than 1 square mile. Please select a smaller area.");
                            graphicsLayer.remove(event.graphic);
                        } else {
                            analyzeArea(polygon);
                        }
                    }
                });

                $('#uploadFileButton').on('click', function() {
                    $('#uploadForm').toggle();
                });

                $('#downloadSummaryButton').on('click', function() {
                    window.location.href = '/download_summary';
                });

                $('#filterButton').on('click', function() {
                    $('#filterOptions').toggle();
                });

                $('#filter').on('change', function() {
                    const filterValue = $(this).val();
                    const filteredSummaries = summariesData.filter(item => {
                        if (filterValue === 'all') return true;
                        const summaryText = item.summary.toLowerCase().trim().replace(/[.,]/g, '');
                        return summaryText === filterValue;
                    });
                    graphicsLayer.removeAll();
                    addMarkersToMap(filteredSummaries, $('#systemPrompt').val());
                });

                document.getElementById('exportButton').addEventListener('click', function() {
                    html2canvas(document.getElementById('map'), {
                        useCORS: true
                    }).then(function(canvas) {
                        var link = document.createElement('a');
                        link.href = canvas.toDataURL('image/png');
                        link.download = 'map.png';
                        link.click();
                    });
                });

                document.getElementById('drawBoundingBoxButton').addEventListener('click', function() {
                    sketchViewModel.create('polygon');
                });

                function addMarkersToMap(summaries, systemPrompt) {
                    const graphics = summaries.map(item => {
                        const point = {
                            type: "point",
                            longitude: parseFloat(item.lon),
                            latitude: parseFloat(item.lat)
                        };

                        // Normalize the summary text
                        const summaryText = item.summary.toLowerCase().trim().replace(/[.,]/g, '');

                        // Change this condition based on your actual logic
                        const markerColor = summaryText === 'yes' ? [255, 0, 0] : [0, 255, 0];

                        const markerSymbol = {
                            type: "simple-marker",
                            color: markerColor,
                            outline: {
                                color: [255, 255, 255],
                                width: 2
                            }
                        };

                        const popupTemplate = {
                            title: "Summary",
                            content: `<h3>${systemPrompt}</h3><p>${item.summary}</p><img src="${item.image_url}" class="img-fluid" alt="Image">`
                        };

                        return new Graphic({
                            geometry: point,
                            symbol: markerSymbol,
                            attributes: item,
                            popupTemplate: popupTemplate
                        });
                    });

                    graphicsLayer.addMany(graphics);

                    // Fit the view to the bounds of the markers
                    if (graphics.length > 0) {
                        view.goTo(graphicsLayer.graphics);
                    }
                }

                function analyzeArea(polygon) {
                    // Show the status modal
                    $('#statusModal').modal('show');

                    const extent = polygon.extent;
                    const tiles = getTilesWithinExtent(extent);
                    const systemPrompt = $('#systemPrompt').val();
                    const promises = tiles.map(tile => {
                        return fetch(tile.url)
                            .then(response => response.blob())
                            .then(blob => {
                                const formData = new FormData();
                                formData.append('image', blob, tile.filename);
                                formData.append('systemPrompt', systemPrompt);
                                return fetch('/upload', {
                                    method: 'POST',
                                    body: formData
                                }).then(response => response.json());
                            });
                    });

                    Promise.all(promises)
                        .then(results => {
                            summariesData = results.map(result => result.summaries).flat();
                            addMarkersToMap(summariesData, systemPrompt);
                            $('#downloadSummaryButton').show();
                            $('#statusModal').modal('hide');
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            $('#statusModal').modal('hide');
                            alert('An error occurred while processing the files.');
                        });
                }

                function getTilesWithinExtent(extent) {
                    const zoomLevel = 15;
                    const tiles = [];

                    const [minLat, minLon] = [extent.ymin, extent.xmin];
                    const [maxLat, maxLon] = [extent.ymax, extent.xmax];

                    const minTile = latLonToTile(minLat, minLon, zoomLevel);
                    const maxTile = latLonToTile(maxLat, maxLon, zoomLevel);

                    for (let x = minTile.x; x <= maxTile.x; x++) {
                        for (let y = minTile.y; y <= maxTile.y; y++) {
                            tiles.push({
                                url: getMapTileUrl(x, y, zoomLevel),
                                filename: `tile_${x}_${y}.png`
                            });
                        }
                    }

                    return tiles;
                }

                function latLonToTile(lat, lon, zoom) {
                    const latRad = Math.PI * lat / 180;
                    const n = Math.pow(2, zoom);
                    const x = Math.floor((lon + 180) / 360 * n);
                    const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
                    return { x, y };
                }

                function getMapTileUrl(x, y, zoom) {
                    const accessToken = 'your-mapbox-access-token';
                    return `https://api.mapbox.com/v4/mapbox.satellite/${zoom}/${x}/${y}@2x.png?access_token=${accessToken}`;
                }
            });
        });
    </script>
</body>
</html>
